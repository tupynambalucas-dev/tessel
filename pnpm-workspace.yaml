catalogMode: 'strict'

packages:
  - 'apps/*'
  - 'packages/*'
  - 'platforms/*'
  - 'studio'
  - 'tools'
  - 'knowledge-base'

catalog:
  '@types/node': '^26.6.6'
  'typescript': '^7.0.2'
  'tsx': '^4.23.15'
  'rimraf': '^6.1.4'
  'turbo': '2.11.11'
  'kill-port': '2.0.1'

catalogs:
  tooling-stack:
    '@eslint/js': '10.0.1'
    '@typescript-eslint/eslint-plugin': '^8.72.2'
    'eslint': '^10.15.0'
    'eslint-import-resolver-typescript': '^4.4.5'
    'eslint-plugin-import': '^2.32.0'
    'prettier': '^3.10.1'
    'typescript-eslint': '^8.72.2'

  shared-stack:
    'zod': '^4.6.7'
    'dotenv': '^18.0.10'
    'date-fns': '^4.4.0'
    'axios': '^1.21.1'
    '@react-three/fiber': '9.8.2'
    '@react-three/drei': '10.7.9'
    '@react-three/postprocessing': '^3.2.2'
    '@react-three/rapier': '^2.2.0'
    'three': '0.187.0'
    '@types/three': '0.187.0'
    'three-stdlib': '2.36.1'
    'tailwindcss': '^4.3.5'
    'xstate': '^5.33.4'
    '@xstate/react': '^6.0.0'
    'tone': '^15.1.22'

  web-stack:
    # Dependencies
    '@gsap/react': '^2.1.2'
    'gsap': '^3.15.1'
    'react': '^19.3.1'
    'react-dom': '^19.3.1'
    'react-i18next': '^18.0.1'
    'i18next': '^27.1.2'
    'react-datepicker': '^9.1.0'
    'zustand': '^5.1.0'
    # Dev Dependencies
    '@vitejs/plugin-react-swc': '^4.3.3'
    '@tailwindcss/vite': '^4.3.5'
    '@types/react': '^19.3.0'
    '@types/react-dom': '^19.3.0'
    'vite': '^8.3.8'
    'eslint-plugin-react': '^7.37.5'
    'eslint-plugin-react-hooks': '^7.1.1'
    'eslint-plugin-react-refresh': '^0.5.8'
    'vite-plugin-svgr': '^5.2.0'

  desktop-stack:
    '7zip-bin': '^5.2.0'
    'node-7z': '^3.0.0'
    '@types/node-7z': '^2.1.11'
    '@electron-toolkit/preload': '^3.0.2'
    '@electron-toolkit/utils': '^4.0.0'
    '@vitejs/plugin-basic-ssl': '^2.3.0'
    'cross-env': '^10.1.0'
    'electron': '45.3.2'
    'electron-builder': '^26.18.0'
    'electron-vite': '^6.0.0'
    'vite-tsconfig-paths': '^6.1.1'

  api-stack:
