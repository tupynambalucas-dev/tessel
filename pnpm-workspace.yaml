    '@fastify/cookie': '^11.1.5'
    '@fastify/cors': '^11.4.3'
    '@fastify/csrf-protection': '^8.0.2'
    '@fastify/env': '^7.0.1'
    '@fastify/jwt': '^10.2.8'
    '@fastify/one-line-logger': '^2.2.1'
    '@fastify/session': '^11.1.6'
    '@sentry/node': '^10.78.0'
    '@sentry/profiling-node': '^10.78.0'
    'bcrypt': '^6.0.0'
    'bullmq': '^6.7.6'
    'fastify': '^5.12.6'
    'fastify-metrics': '^15.0.1'
    'fastify-plugin': '^6.0.1'
    'fastify-type-provider-zod': '^7.0.0'
    'ioredis': '^6.0.0'
    'mongoose': '^9.12.1'
    'pino-roll': '^4.0.0'
    'sdk-node-apis-efi': '^2.0.1'
    # Dev Dependencies
    '@types/bcrypt': '^6.0.0'

  docs-stack:
    # Dependencies
    '@docusaurus/core': '3.10.2'
    '@docusaurus/faster': '3.10.2'
    '@docusaurus/preset-classic': '3.10.2'
    '@mdx-js/react': '^3.0.0'
    'clsx': '^2.0.0'
    'prism-react-renderer': '^2.3.0'
    'react': '^19.0.0'
    'react-dom': '^19.0.0'
    # Dev Dependencies
    '@docusaurus/module-type-aliases': '3.10.2'
    '@docusaurus/tsconfig': '3.10.2'
    '@docusaurus/types': '3.10.2'
    '@types/react': '^19.0.0'
    'typescript': '~6.0.2'
    '@docusaurus/theme-live-codeblock': '3.10.2'
    '@docusaurus/theme-mermaid': '3.10.2'
    '@tailwindcss/postcss': '^4.3.5'

  studio-stack:
    '@fontsource-variable/nunito': '^5.3.0'
    '@fontsource/nunito': '^5.2.7'
    '@fortawesome/fontawesome-svg-core': '^7.3.1'
    '@fortawesome/free-brands-svg-icons': '^7.3.1'
    '@fortawesome/free-regular-svg-icons': '^7.3.1'
    '@fortawesome/free-solid-svg-icons': '^7.3.1'
    '@fortawesome/react-fontawesome': '^3.5.0'

allowBuilds:
  '@sentry-internal/node-cpu-profiler': true
  '@swc/core': true
  'bcrypt': true
  'core-js': true
  electron: true
  electron-winstaller: true
  'esbuild': true
  'msgpackr-extract': true
  'unrs-resolver': true
